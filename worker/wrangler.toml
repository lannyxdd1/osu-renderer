name = "osu-replays"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Public URL of the Worker. Replace after the first `wrangler deploy` and
# deploy once more so that share links become absolute.
PUBLIC_BASE = "https://osu-replays.lannyxdd.workers.dev"
# GitHub Pages address of the site (no trailing slash).
PAGES_BASE = "https://lannyxdd1.github.io/osu-renderer"
# Repository that stores one release per replay. Must be public.
GITHUB_REPO = "lannyxdd1/osu-renderer"
# "redirect" serves video straight from GitHub, "proxy" streams it through
# the Worker. GitHub sends release assets as application/octet-stream with
# `Content-Disposition: attachment`, which some browsers refuse to play, so
# the default is "proxy": the Worker re-labels the stream as video/mp4.
MEDIA_MODE = "proxy"

[[kv_namespaces]]
binding = "REPLAYS"
id = "436a3ada810d4f1588a953e13f7781c5"
